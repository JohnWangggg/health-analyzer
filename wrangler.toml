# Cloudflare Workers / Pages（静态资源）部署配置
# 本地预览: npx wrangler dev
# 部署:     npx wrangler deploy
# 文档:     https://developers.cloudflare.com/workers/static-assets/

name = "health-analyzer"
compatibility_date = "2026-07-29"

# 将纯前端 PWA 目录作为静态资源发布（无后端 Worker 逻辑也可）
# assets.directory → web-ui/public
# Strategy A: root = React (npm run react:export-cutover); rollback = /legacy/
[assets]
directory = "./web-ui/public"
# React SPA deep links (/trends, /reports, /data) need index fallback.
# Legacy under /legacy/ uses its own relative index; SPA fallback must not break it
# if the host only rewrites unknown paths without a file (verify on deploy).
not_found_handling = "single-page-application"
