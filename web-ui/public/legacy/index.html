<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0;url=../" />
    <title>已迁移 · 返回健康 OS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0b1220;
        color: #e8eef7;
        text-align: center;
        padding: 1.5rem;
      }
      a {
        color: #7dd3d3;
        font-weight: 600;
      }
      p {
        max-width: 28rem;
        line-height: 1.5;
        opacity: 0.9;
      }
    </style>
    <script>
      // Prefer SPA base-aware navigation when possible
      (function () {
        try {
          var base = document.querySelector('base');
          // Project Pages: /health-analyzer/legacy/ → /health-analyzer/
          var path = location.pathname.replace(/\/legacy\/?$/, '/');
          if (path && path !== location.pathname) {
            location.replace(path + (location.search || '') + (location.hash || ''));
            return;
          }
          location.replace('../');
        } catch (e) {
          location.replace('../');
        }
      })();
    </script>
  </head>
  <body>
    <div>
      <h1>旧版界面已移除</h1>
      <p>
        生产入口为 React 健康 OS。若未自动跳转，请
        <a href="../" data-testid="legacy-redirect-home">返回新版</a>。
      </p>
      <p style="font-size: 0.85rem; opacity: 0.7">
        能力对照与迁移说明见仓库 docs/LEGACY_PARITY.md
      </p>
    </div>
  </body>
</html>
