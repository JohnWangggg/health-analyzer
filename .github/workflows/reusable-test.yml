# Reusable: lib unit tests + build + FHIR (incl. required HL7) + E2E
name: Reusable test & build

on:
  workflow_call:

jobs:
  test:
    name: Lib unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lib/package-lock.json

      - name: Setup Java (HL7 validator_cli)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache HL7 validator jar + FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            tools/validator_cli.jar
            ~/.fhir/packages
          key: fhir-hl7-validator-${{ runner.os }}-6.9.12-v1
          restore-keys: |
            fhir-hl7-validator-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # package.json: "build" = tsc && build:browser
      - name: Build (tsc + browser bundle)
        run: npm run build

      - name: Install root (Playwright + scripts)
        working-directory: .
        run: npm ci

      - name: Install React app deps
        working-directory: .
        run: npm run react:install

      - name: Export cutover (React at public root)
        working-directory: .
        run: npm run react:export-cutover

      - name: UI / i18n smoke (legacy tree + React root)
        working-directory: .
        run: node scripts/smoke.mjs

      - name: FHIR structure + exchange + required HL7 (fixture + stripped export)
        working-directory: .
        run: npm run test:fhir:ci
        env:
          # Belt-and-suspenders: scripts also set REQUIRED=1
          FHIR_HL7_REQUIRED: '1'

      - name: Install Playwright Chromium
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: E2E legacy rollback (/legacy/)
        working-directory: .
        run: npx playwright test
        env:
          CI: 'true'

      - name: E2E React default root
        working-directory: .
        run: npm run test:e2e:react
        env:
          CI: 'true'
