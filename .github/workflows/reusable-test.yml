# Reusable: lib unit tests + build (tsc + browser bundle)
name: Reusable test & build

on:
  workflow_call:

jobs:
  test:
    name: Lib unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lib/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # package.json: "build" = tsc && build:browser
      - name: Build (tsc + browser bundle)
        run: npm run build

      - name: UI / i18n smoke (static + locale)
        working-directory: .
        run: node scripts/smoke.mjs

      - name: Install root (Playwright)
        working-directory: .
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        working-directory: .
        run: npx playwright test
        env:
          CI: 'true'
