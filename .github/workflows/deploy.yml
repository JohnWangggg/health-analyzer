name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 部署前门禁：test/build 失败则不部署（与 CI 共用 reusable-test.yml）
  test:
    name: Pre-deploy tests
    uses: ./.github/workflows/reusable-test.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/react-app/package-lock.json
            lib/package-lock.json

      - name: Build lib + React cutover publish tree
        env:
          # Project Pages URL: https://<user>.github.io/<repo>/
          GITHUB_PAGES_DEPLOY: 'true'
        run: |
          npm --prefix lib ci
          npm --prefix lib run build
          npm ci
          npm run react:install
          npm run react:export-cutover
          test -f web-ui/public/index.html
          test -f web-ui/public/404.html
          test -f web-ui/public/legacy/index.html
          test -f web-ui/public/CUTOVER_STAMP.txt
          head -8 web-ui/public/CUTOVER_STAMP.txt
          # Asset hrefs must include repo base (not absolute /assets only without prefix)
          grep -E 'src=|href=' web-ui/public/index.html | head -8

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web-ui/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
